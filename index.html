<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Chat Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-container" class="container active">
    <div class="auth-box">
      <h1>Desktop Chat</h1>
      <p class="subtitle">Sign in to continue</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="Enter username" required>
        </div>
        
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Login</button>
        
        <p class="switch-auth">
          Don't have an account? 
          <a href="#" id="show-register">Register here</a>
        </p>
      </form>
      
      <div id="login-error" class="error-message"></div>
    </div>
  </div>

  <!-- Registration Screen -->
  <div id="register-container" class="container">
    <div class="auth-box">
      <h1>Create Account</h1>
      <p class="subtitle">Join the chat community</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" placeholder="Choose username" required>
        </div>
        
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="Enter email" required>
        </div>
        
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="Choose password" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Register</button>
        
        <p class="switch-auth">
          Already have an account? 
          <a href="#" id="show-login">Login here</a>
        </p>
      </form>
      
      <div id="register-error" class="error-message"></div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-container" class="container">
    <div class="chat-layout">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="user-info">
            <div class="user-avatar" id="current-user-avatar">U</div>
            <div class="user-details">
              <h3 id="current-username">User</h3>
              <span class="status-indicator online"></span>
              <span class="status-text">Online</span>
            </div>
          </div>
          <button id="logout-btn" class="btn-icon" title="Logout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
        
        <div class="search-box">
          <input type="text" id="user-search" placeholder="Search users...">
        </div>
        
        <div class="users-list" id="users-list">
          <!-- Users will be dynamically added here -->
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area">
        <div class="chat-header" id="chat-header" style="display: none;">
          <div class="chat-user-info">
            <div class="user-avatar" id="chat-user-avatar">U</div>
            <div>
              <h3 id="chat-username">Select a user</h3>
              <span class="user-status" id="chat-user-status">Offline</span>
            </div>
          </div>
        </div>

        <div class="chat-welcome" id="chat-welcome">
          <div class="welcome-content">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h2>Welcome to Desktop Chat</h2>
            <p>Select a user from the list to start chatting</p>
          </div>
        </div>

        <div class="messages-container" id="messages-container" style="display: none;">
          <!-- Messages will be dynamically added here -->
        </div>

        <div class="typing-indicator" id="typing-indicator" style="display: none;">
          <span></span><span></span><span></span>
        </div>

        <div class="chat-input-container" id="chat-input-container" style="display: none;">
          <form id="message-form">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="btn-send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
